name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: win64_msvc2019_64
          cache: true

      - name: Install curl and json via vcpkg
        run: vcpkg install curl:x64-windows nlohmann-json:x64-windows

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release

      - name: Pack
        shell: pwsh
        run: Compress-Archive -Path build/Release/* -DestinationPath CyberLauncher-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CyberLauncher-windows
          path: CyberLauncher-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install qt cmake curl nlohmann-json

      - name: Configure
        run: cmake -B build -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build (macdeployqt runs automatically)
        run: cmake --build build

      - name: Pack
        run: ditto -c -k --keepParent build/CyberLauncher.app CyberLauncher-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CyberLauncher-macos
          path: CyberLauncher-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
