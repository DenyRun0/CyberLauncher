name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: win64_msvc2019_64
          cache: true

      - name: Install libcurl
        run: vcpkg install curl:x64-windows

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/Release/* -DestinationPath CyberLauncher-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CyberLauncher-windows
          path: CyberLauncher-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Bundle Qt and sign (ad-hoc)
        run: |
          macdeployqt build/CyberLauncher.app
          codesign --force --deep -s - build/CyberLauncher.app

      - name: Package
        run: |
          mkdir dist
          cp -R build/CyberLauncher.app dist/
          cp run-mac.command dist/
          chmod +x dist/run-mac.command
          ditto -c -k --keepParent dist CyberLauncher-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CyberLauncher-macos
          path: CyberLauncher-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
