name: build

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: win64_msvc2019_64
          cache: true

      - name: Install curl and json via vcpkg
        run: vcpkg install curl:x64-windows nlohmann-json:x64-windows

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release

      - name: Pack
        shell: pwsh
        run: Compress-Archive -Path build/Release/* -DestinationPath CyberLauncher-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CyberLauncher-windows
          path: CyberLauncher-windows.zip

  macos:
    name: Збірка macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            archive: CyberLauncher-macos-intel
          - runner: macos-15
            arch: arm64
            archive: CyberLauncher-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Встановлення Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Налаштування збірки для macOS 12 і новіших
        run: |
          SDK="$(xcrun --show-sdk-path)"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCURL_NO_CURL_CMAKE=ON \
            -DCURL_LIBRARY="$SDK/usr/lib/libcurl.tbd" \
            -DCURL_INCLUDE_DIR="$SDK/usr/include" \
            -DBUILD_TESTING=ON

      - name: Збірка та тести
        run: |
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure

      - name: Перевірка архітектури та пакування
        run: |
          APP=build/CyberLauncher.app
          test -f "$APP/Contents/MacOS/CyberLauncher"
          test -d "$APP/Contents/Frameworks/QtCore.framework"
          lipo "$APP/Contents/MacOS/CyberLauncher" -verify_arch "${{ matrix.arch }}"
          lipo "$APP/Contents/Frameworks/QtCore.framework/QtCore" -verify_arch "${{ matrix.arch }}"
          codesign --verify --deep "$APP"
          ditto -c -k --keepParent "$APP" "${{ matrix.archive }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}.zip

  release:
    # Релізи за тегами; для першої збірки Intel — явна позначка в коміті.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[реліз]'))
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v3.1-build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('CyberLauncher 3.1 — збірка {0}', github.run_number) }}
          fail_on_unmatched_files: true
          files: dist/*.zip
